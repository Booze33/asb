<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Contact Form</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .message { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h2>Test Contact Form</h2>
    <form id="contactForm">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" value="Test User" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" value="test@example.com" required>
        </div>
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" value="555-1234" required>
        </div>
        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" value="123 Test St" required>
        </div>
        <div class="form-group">
            <label for="date_time">Preferred Date & Time</label>
            <input type="datetime-local" id="date_time" name="date_time" required>
        </div>
        <div class="form-group">
            <label for="duration">Estimated Duration (minutes)</label>
            <input type="number" id="duration" name="duration" value="60" min="15" step="15" required>
        </div>
        <div class="form-group">
            <label for="service">Service Needed</label>
            <select id="service" name="service" required>
                <option value="">Select a service...</option>
                <option>Haircut & Styling</option>
                <option>Color & Highlights</option>
                <option>Makeup Artistry</option>
                <option>Facial & Skincare</option>
                <option>Nail Services</option>
                <option>Bridal Package</option>
                <option>Other</option>
            </select>
        </div>
        <div class="form-group">
            <label for="message">Message / Notes</label>
            <textarea id="message" name="message" rows="4">Test message</textarea>
        </div>
        <button type="submit">Request My Appointment</button>
    </form>

    <div id="message" class="message" style="display: none;"></div>

    <script>
        // Set default date to tomorrow at 10:00 AM
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        tomorrow.setHours(10, 0, 0, 0);
        document.getElementById('date_time').value = tomorrow.toISOString().slice(0, 16);

        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            
            // Extract and convert duration to number
            const durationValue = formData.get('duration');
            const duration = durationValue ? parseInt(durationValue.toString(), 10) : 0;
            
            const appointmentData = {
                name: formData.get('name'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                address: formData.get('address'),
                date_time: formData.get('date_time'),
                duration: duration.toString(),
            };

            showMessage('Sending appointment request...', 'info');
            
            try {
                // Test with the actual API
                const response = await fetch('http://localhost:3008/api/appointments', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(appointmentData),
                });

                const result = await response.json();
                
                if (result.success) {
                    showMessage('Booking Request Received: ' + (result.message || 'We\'ll confirm your appointment within 2 hours during business hours.'), 'success');
                    e.target.reset();
                } else {
                    showMessage('Error: ' + (result.error || 'Failed to submit your appointment. Please try again.'), 'error');
                }
            } catch (error) {
                showMessage('Network Error: ' + error.message, 'error');
            }
        });

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>
